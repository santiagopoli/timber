name: Verify and deploy Timber
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - name: Exercise admin console in Chromium
        env:
          CONSOLE_CHROMIUM_PATH: /usr/bin/google-chrome
          CONSOLE_SCREENSHOT_DIR: test-results/console
        run: npm run test:console
      - name: Retain console screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-screenshots
          path: test-results/console
          if-no-files-found: ignore
      - name: Build Worker bundle
        run: npx wrangler deploy --config apps/api/wrangler.production.jsonc --dry-run --outdir .wrangler/dry-run
  desktop-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build desktop computer
        run: docker build --file infra/computer/Dockerfile --tag timber-computer:ci infra/computer
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise real desktop image
        shell: bash
        run: |
          export COMPUTER_TEST_TOKEN="$(openssl rand -hex 32)"
          trap 'docker rm -f timber-image-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name timber-image-smoke --shm-size=512m -p 127.0.0.1:8080:8080 -e BOTSPACE_COMPUTER_TOKEN="$COMPUTER_TEST_TOKEN" timber-computer:ci
          node scripts/smoke-computer.mjs
          docker exec -i timber-image-smoke python3 - < infra/computer/smoke_desktop.py
      - name: Export the verified production image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save timber-computer:ci | gzip -1 > timber-computer.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: verified-computer-image
          path: timber-computer.tar.gz
          compression-level: 0
          retention-days: 1
  deploy:
    name: Deploy production
    needs: [verify, desktop-image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: timber-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Skip superseded revision
        id: revision
        shell: bash
        run: |
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer commit is on main; this revision will not deploy."
          fi
      - uses: actions/download-artifact@v4
        if: steps.revision.outputs.current == 'true'
        with:
          name: verified-computer-image
          path: .verified-image
      - name: Deploy API and preview gateway
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: '3acfff91febe1ba644c6358ae5612736'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            unset CLOUDFLARE_API_KEY CLOUDFLARE_EMAIL
          elif [ -n "$CLOUDFLARE_API_KEY" ] && [ -n "$CLOUDFLARE_EMAIL" ]; then
            unset CLOUDFLARE_API_TOKEN
          else
            echo "::error::Configure CLOUDFLARE_API_TOKEN or both CLOUDFLARE_API_KEY and CLOUDFLARE_EMAIL in GitHub Actions secrets."
            exit 1
          fi
          docker load --input .verified-image/timber-computer.tar.gz
          docker tag timber-computer:ci "timber-computer:${GITHUB_SHA}"
          npx wrangler containers push "timber-computer:${GITHUB_SHA}" --config apps/api/wrangler.production.jsonc
          docker image inspect "registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/timber-computer:${GITHUB_SHA}" \
            --format '{{json .RepoDigests}}' > .verified-image/digests.json
          node scripts/pin-computer-image.mjs apps/api/wrangler.production.jsonc .verified-image/digests.json .verified-image/release.json
          npm run deploy
      - uses: actions/upload-artifact@v4
        if: always() && steps.revision.outputs.current == 'true'
        with:
          name: production-image-reference
          path: .verified-image/release.json
          if-no-files-found: ignore
      - name: Check production health
        if: steps.revision.outputs.current == 'true'
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 \
            https://timber-api.santiagopoli.workers.dev/health | \
            node --input-type=module -e 'let body=""; for await (const chunk of process.stdin) body+=chunk; const health=JSON.parse(body); if(health.ok!==true || health.service!=="botspace") process.exit(1); console.log("Production health passed");'
