name: Read durable production diagnostics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/durable-diagnostics.yml'
      - 'scripts/prod-durable-diagnostics.mjs'
      - 'scripts/prod-performance-diagnostics.mjs'
      - 'scripts/tests/prod-*-diagnostics.test.mjs'
  workflow_dispatch:
    inputs:
      scope:
        description: Fixed read-only diagnostic to run
        required: true
        default: native
        type: choice
        options:
          - native
          - avatars
          - performance
          - queue
      hours:
        description: Hours of recent failure metadata to inspect (1 to 24)
        required: true
        default: '1'
        type: string
      task_prefix:
        description: Optional exact eight hexadecimal characters identifying one task
        required: false
        type: string
      recipient_public_key:
        description: Optional ephemeral RSA public key PEM (3072+ bits); encrypts bounded private diagnostic evidence
        required: false
        type: string
permissions:
  contents: read
jobs:
  diagnostics:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify durable diagnostic filtering
        run: node --test scripts/tests/prod-durable-diagnostics.test.mjs scripts/tests/prod-performance-diagnostics.test.mjs
      - name: Read fixed durable failure signatures
        env:
          CLOUDFLARE_ACCOUNT_ID: '3acfff91febe1ba644c6358ae5612736'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          DIAGNOSTIC_HOURS: ${{ inputs.hours || '24' }}
          DIAGNOSTIC_SCOPE: ${{ inputs.scope || 'performance' }}
          DIAGNOSTIC_TASK_PREFIX: ${{ inputs.task_prefix || '' }}
          DIAGNOSTIC_RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
        run: |
          if [ -z "$DIAGNOSTIC_RECIPIENT_PUBLIC_KEY" ] && [ -f .github/diagnostic-recipient.pub ]; then
            export DIAGNOSTIC_RECIPIENT_PUBLIC_KEY="$(cat .github/diagnostic-recipient.pub)"
          fi
          node scripts/prod-durable-diagnostics.mjs
