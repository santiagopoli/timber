name: Read durable production diagnostics
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Fixed read-only diagnostic to run
        required: true
        default: native
        type: choice
        options:
          - native
          - avatars
      hours:
        description: Hours of recent failure metadata to inspect (1 to 24)
        required: true
        default: '1'
        type: string
      recipient_public_key:
        description: Optional ephemeral RSA public key PEM (3072+ bits); encrypts only three native failure details for private diagnosis
        required: false
        type: string
permissions:
  contents: read
jobs:
  diagnostics:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify durable diagnostic filtering
        run: node --test scripts/tests/prod-durable-diagnostics.test.mjs
      - name: Read fixed durable failure signatures
        env:
          CLOUDFLARE_ACCOUNT_ID: '3acfff91febe1ba644c6358ae5612736'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          DIAGNOSTIC_HOURS: ${{ inputs.hours }}
          DIAGNOSTIC_SCOPE: ${{ inputs.scope }}
          DIAGNOSTIC_RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
        run: node scripts/prod-durable-diagnostics.mjs
