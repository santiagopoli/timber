name: Deploy the verified model transport resource correction
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: timber-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Limit this deployment to the tested resource correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38572270445 --name production-image-reference --dir .verified-transport
          node scripts/guard-model-transport-deploy.mjs
      - run: npm ci
      - name: Verify authentication, isolation, streaming and cancellation
        run: |
          npm run typecheck
          npm test -- --maxWorkers=1 tests/chatgpt.spec.ts tests/chatgpt-transport.spec.ts
          node --test scripts/tests/chatgpt-transport.test.mjs scripts/tests/model-catalog-probe.test.mjs scripts/tests/pin-computer-image.test.mjs
      - name: Publish API using the already exercised immutable image
        env:
          CLOUDFLARE_ACCOUNT_ID: '3acfff91febe1ba644c6358ae5612736'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$current" = "$GITHUB_SHA" || { echo 'Revision superseded; deployment stopped.'; exit 1; }
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            unset CLOUDFLARE_API_KEY CLOUDFLARE_EMAIL
          else
            test -n "$CLOUDFLARE_API_KEY" && test -n "$CLOUDFLARE_EMAIL"
            unset CLOUDFLARE_API_TOKEN
          fi
          npm run build:console
          npx wrangler deploy --config apps/api/wrangler.production.jsonc
          curl --fail --silent --show-error --max-time 30 https://timber-api.santiagopoli.workers.dev/health > /dev/null
