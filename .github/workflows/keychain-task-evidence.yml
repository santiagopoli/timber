name: Read encrypted Keychain task evidence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/keychain-task-evidence.yml']
permissions:
  contents: read
jobs:
  evidence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/tests/prod-durable-diagnostics.test.mjs scripts/tests/prod-performance-diagnostics.test.mjs
      - name: Read encrypted task evidence
        env:
          CLOUDFLARE_ACCOUNT_ID: '3acfff91febe1ba644c6358ae5612736'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          DIAGNOSTIC_HOURS: '24'
          DIAGNOSTIC_SCOPE: performance
          DIAGNOSTIC_RECIPIENT_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAtaYRngmeu5ppLBhhSGAC
            YdSXBH3ypHvq5CZTTIgGv6hH+WI+M6t9tNBMdhEx32+0BbWzZdW8QM2yOIdQb5et
            ieIR0tJRdOPbSX91z73pWzJp+/XgwRBiRVCeeB9hlBOkMtICcAiYrtBy/NnmJpcV
            lC2Lzjw1nLtcSB8BjemwkgXcC0i3oAbFtFYHcU6EiI6Z4QcQh/HOhtAHPRSyfB6G
            b+c/CigXw4paqa+XMnBZXs7M0UrKqQA8Q1Uawqu00WAz0VBUk2XzVeqJ39e94qN3
            A3vMzxS1nwuRMcVymspQCR5bf4Pm82n7mJI/d3Ro2eyr1fD0zaju01sVfrJ4xgg4
            SNj+KNYvi4X5lHh0Qkc7fpXqBUzWzQgutzPNYRh/4JdoiwiUUmFYhe6D3IVnEw+u
            1jX3B9OgRPHM3sP5honImQkZoAeuo07phqopGZZpNAHkXVku6rhUIiXKNFxagYgG
